<!doctype html>
<html "lang=en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

        <title>
            MY TO DO LIST
        </title>
    </head>
    <body>
        <h1>
            Welcome to Sarra's To Do List
        </h1>
        <form method="post" action="/add">
        <input required type="text" name="task" placeholder="New task...">
        <button type="submit">Add</button>
        </form>
        {% for task in tasks %}
        <ul>
        <li class="{% if task.done %}done{% endif %} {% if task.pinned %}pinned{% endif %}">
            <span class="task-text">
            {% if task.pinned %}📌{% endif %}
            {{ task.text }}
        </span>
            <div class="actions">
                <form method="post" action="{{ url_for('pin_task', task_id=task.id) }}">
                    <button type="submit">Pin</button>
                </form>
                <form method="post" action="{{ url_for('delete_task', task_id=task.id) }}">
                    <button>🗑️</button>
                </form>
                <form method="post" action="{{ url_for('done_task', task_id=task.id) }}">
                    <button type="submit">Done</button>
                </form>
            </div>
        </li>
        {% endfor %}
        </ul>


    </body>
</html>
